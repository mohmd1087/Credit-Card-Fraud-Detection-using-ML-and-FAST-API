<!DOCTYPE html>
<html>
<head>
    <title>Predict Scam</title>
</head>
<body>
    <h2>Predict Scam</h2>
    <form action="/predict" method="post">
        <label for="time">Time:</label>
        <input type="number" step="any" name="time" id="time" required><br><br>
        
        <label for="amount">Amount:</label>
        <input type="number" step="any" name="amount" id="amount" required><br><br>
        
        <!-- Add fields for V1 to V28 -->
        {% for i in range(1, 29) %}
            <label for="V{{ i }}">V{{ i }}:</label>
            <input type="number" step="any" name="V{{ i }}" id="V{{ i }}" required><br><br>
        {% endfor %}
        
        <input type="submit" value="Predict">
    </form>
    {% if result %}
        <h3>Prediction Result: {{ result }}</h3>
    {% endif %}
</body>
</html>
